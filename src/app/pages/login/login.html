<div class="pagina-login">
  <div class="cartao-login">
    <!-- Ícone de Escudo Superior -->
    <div class="topo-icone">
      <div class="escudo-marca">🛡️</div>
    </div>

    <h2>Bem-vindo de volta</h2>
    <p class="instrucao">Acesse o painel do TerceiroFlex para gerenciar a conformidade</p>

    <!-- Formulário de Login ajustado com o (submit) e ngModel -->
    <form class="formulario" (submit)="$event.preventDefault(); entrar()">
      <div class="grupo-input">
        <label>E-mail</label>
        <div class="input-com-icone">
          <span class="icone-input">✉️</span>
          <input type="email" [(ngModel)]="email" name="email" required />
        </div>
      </div>
      
      <div class="grupo-input">
        <label>Senha</label>
        <div class="input-com-icone">
          <span class="icone-input">🔒</span>
          <input type="password" [(ngModel)]="senha" name="senha" required />
        </div>
      </div>

      <div class="opcoes">
        <label class="lembrar">
          <input type="checkbox" checked /> Manter conectado
        </label>
        <a href="#" class="esqueci-senha">Esqueci minha senha</a>
      </div>

      <button routerLink="/dashboard" type="submit" class="botao-entrar">Entrar na plataforma →</button>
    </form>

    <p class="rodape-link">
      Não possui uma conta? <a routerLink="/cadastro">Criar conta</a>
    </p>
  </div>
</div>
